name: Verify live SMO W3ID

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-w3id:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install verifier dependency
        run: python -m pip install rdflib

      - name: Verify live current W3ID routes
        run: python publication/verify-live-w3id.py
