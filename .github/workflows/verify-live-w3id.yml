name: Verify live SMO W3ID

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "publication/verify-live-w3id.py"
      - ".github/workflows/verify-live-w3id.yml"

permissions:
  contents: read

jobs:
  verify-live-w3id:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install verifier dependency
        run: python -m pip install rdflib

      - name: Verify live current and immutable W3ID routes
        run: python publication/verify-live-w3id.py
