name: Verify prepared live SMO W3ID verifier

on:
  pull_request:
    paths:
      - "publication/verify-live-w3id.py"
      - ".github/workflows/verify-prepared-live-w3id.yml"
  push:
    branches:
      - agent/handle-w3id-canonicalization
    paths:
      - "publication/verify-live-w3id.py"
      - ".github/workflows/verify-prepared-live-w3id.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install verifier dependency
        run: python -m pip install rdflib

      - name: Compile live verifier
        run: python -m py_compile publication/verify-live-w3id.py

      - name: Exercise canonicalization, backend, and retry contracts without network access
        shell: bash
        run: |
          python - <<'PY'
          import http.client
          import importlib.util
          from pathlib import Path

          path = Path("publication/verify-live-w3id.py")
          spec = importlib.util.spec_from_file_location("smo_live_verifier", path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          good_turtle = b'''@prefix owl: <http://www.w3.org/2002/07/owl#> .
          <https://w3id.org/smo>
              a owl:Ontology ;
              owl:versionIRI <https://w3id.org/smo/0.1.0> ;
              owl:versionInfo "0.1.0" .
          <https://w3id.org/smo#SemanticModel> a owl:Class .
          <https://w3id.org/smo#ImplementationProjection> a owl:Class .
          '''

          def good_redirect_once(url: str, accept: str):
              if url == module.BASE:
                  return 301, module.BASE + "/"
              if url == module.BASE + "/" and accept.startswith("text/html"):
                  return 303, module.CURRENT_HTML
              if url == module.BASE + "/" and accept == "text/turtle":
                  return 303, module.CURRENT_RAW
              if url == module.DIST and accept == "text/turtle":
                  return 303, module.CURRENT_RAW
              if url == module.VERSION:
                  return 301, module.VERSION + "/"
              if url == module.VERSION + "/" and accept.startswith("text/html"):
                  return 303, module.VERSION_HTML
              if url == module.VERSION + "/" and accept == "text/turtle":
                  return 303, module.VERSION_RAW
              if url == module.VERSION_DIST and accept == "text/turtle":
                  return 303, module.VERSION_RAW
              raise AssertionError((url, accept))

          def good_fetch(url: str, accept: str = "text/turtle"):
              assert accept == "text/turtle"
              assert url in {module.CURRENT_RAW, module.VERSION_RAW}
              return good_turtle, "text/turtle"

          module.redirect_once = good_redirect_once
          module.fetch_target = good_fetch
          assert module.main() == 0

          def mutable_version_redirect_once(url: str, accept: str):
              status, target = good_redirect_once(url, accept)
              if url == module.VERSION + "/" and accept == "text/turtle":
                  return status, module.CURRENT_RAW
              return status, target

          module.redirect_once = mutable_version_redirect_once
          try:
              module.main()
          except AssertionError as exc:
              assert "Immutable Turtle route resolved unexpectedly" in str(exc)
          else:
              raise AssertionError("mutable immutable-route negative control unexpectedly passed")

          bad_turtle = b'''@prefix owl: <http://www.w3.org/2002/07/owl#> .
          <https://w3id.org/smo>
              a owl:Ontology ;
              owl:versionIRI <https://w3id.org/smo/0.1.0> ;
              owl:versionInfo "0.1.0" .
          <https://w3id.org/smo#SemanticModel> a owl:Class .
          '''

          def missing_term_fetch(url: str, accept: str = "text/turtle"):
              assert accept == "text/turtle"
              if url == module.VERSION_RAW:
                  return bad_turtle, "text/turtle"
              return good_turtle, "text/turtle"

          module.redirect_once = good_redirect_once
          module.fetch_target = missing_term_fetch
          try:
              module.main()
          except AssertionError as exc:
              assert "ImplementationProjection missing from immutable v0.1.0 RDF" in str(exc)
          else:
              raise AssertionError("missing-term negative control unexpectedly passed")

          original_sleep = module.time.sleep
          module.time.sleep = lambda _: None
          attempts = {"count": 0}

          def transient_then_ok():
              attempts["count"] += 1
              if attempts["count"] < 3:
                  raise http.client.RemoteDisconnected("transient test disconnect")
              return "ok"

          assert module.with_retries(transient_then_ok, "offline retry test") == "ok"
          assert attempts["count"] == 3
          module.time.sleep = original_sleep

          print("SUCCESS: verifier follows internal W3ID canonicalization only, validates terminal 303 targets, immutable RDF identity, negative controls, and bounded retries without network access.")
          PY
